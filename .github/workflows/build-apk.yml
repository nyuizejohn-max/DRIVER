
name: Build Driver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore permanent signing keystore
        run: |
          echo "$DRIVER_KEYSTORE_BASE64" | base64 --decode > android/app/driver-debug.keystore
        env:
          DRIVER_KEYSTORE_BASE64: ${{ secrets.DRIVER_KEYSTORE_BASE64 }}
      - name: Build APK
        run: flutter build apk --debug
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          DRIVER_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}

      - name: Show permanent signing SHA-1
        run: |
          keytool -list -v \
            -keystore android/app/driver-debug.keystore \
            -alias driverdebug \
            -storepass "$DRIVER_KEYSTORE_PASSWORD" \
            -keypass "$DRIVER_KEYSTORE_PASSWORD" | grep SHA1
        env:
          DRIVER_KEYSTORE_PASSWORD: ${{ secrets.DRIVER_KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRIVER-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
